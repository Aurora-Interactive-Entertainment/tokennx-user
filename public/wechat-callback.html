<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>微信登录 · Token NX</title>
    <script>
      (() => {
        const url = new URL(window.location.href)
        const codes = url.searchParams.getAll('code')
        const states = url.searchParams.getAll('state')
        // 在加载任何资源前清除一次性参数；回调页不存储、不兑换、不记录授权码。
        url.searchParams.delete('code')
        url.searchParams.delete('state')
        window.history.replaceState(null, '', url.pathname + url.search + url.hash)

        let language = navigator.language
        try {
          if (window.parent !== window) {
            language = window.parent.document.documentElement.lang || language
            document.documentElement.dataset.theme = window.parent.document.documentElement.dataset.theme || ''
          }
        } catch { /* 非同源父窗口由 postMessage 的明确目标来源隔离。 */ }
        const en = language.toLowerCase().startsWith('en')
        document.documentElement.lang = en ? 'en' : 'zh-CN'
        document.title = en ? 'WeChat sign-in · Token NX' : '微信登录 · Token NX'
        const valid = codes.length === 1 && states.length === 1 && codes[0].trim() && codes[0].length <= 512 && /^[A-Za-z0-9_-]{1,256}$/.test(states[0])
        const embedded = window.parent !== window
        if (valid && embedded) {
          // 只交给发起登录的同源父页面；父页面还须检查 source 和当前二维码 state。
          // 正式回调页也兼容本地联调：只向嵌入页面的 referrer origin 回传一次性参数。
          let parentOrigin = '*'
          try {
            if (document.referrer) {
              const referrerOrigin = new URL(document.referrer).origin
              if (referrerOrigin !== 'https://open.weixin.qq.com') parentOrigin = referrerOrigin
            }
          } catch { /* 回调消息仍可由登录页按来源、窗口和 state 校验。 */ }
          window.parent.postMessage({ type: 'token-nx:wechat-callback', code: codes[0], state: states[0] }, parentOrigin)
        }
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('callback-status').textContent = valid && embedded
            ? (en ? 'Completing WeChat sign-in…' : '正在完成微信登录…')
            : (en ? 'This sign-in link has expired. Return to the website and sign in again.' : '本次登录链接已失效，请返回网站重新使用微信登录。')
          const link = document.getElementById('callback-login')
          link.textContent = en ? 'Return to sign-in' : '返回登录'
          link.hidden = embedded
        }, { once: true })
      })()
    </script>
    <link rel="stylesheet" href="/wechat-callback.css" />
  </head>
  <body>
    <main><p id="callback-status" role="status">正在处理微信登录…</p><a id="callback-login" href="/login" hidden>返回登录</a></main>
  </body>
</html>
