<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 保留原图透明轮廓；深色标签栏使用白底黑 Logo，浅色标签栏保持透明底。 -->
  <style>
    .background { fill: transparent; }
    .logo { fill: #181a1e; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #fff; }
      .logo { fill: #000; }
    }
  </style>
  <defs>
    <mask id="logo" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" style="mask-type: alpha">
      <image width="64" height="64" href="data:image/png;base64," />
    </mask>
  </defs>
  <path class="background" d="M0 0h64v64H0z" />
  <path class="logo" d="M0 0h64v64H0z" mask="url(#logo)" />
</svg>
