# Token NX 用户端静态站点的 OpenResty/Nginx 规则。
#
# 这是放进现有 server {} 的示例片段，root 请按实际机器的发布目录调整。
# 规则顺序很重要：/assets/ 必须先于通用 SPA 回退，否则缺失的 JS/CSS 会被
# /index.html 以 200 + text/html 返回，浏览器会在 React 启动前直接白屏。
root /var/www/tokennx-user/current;

# Vite 产出的文件名带内容 hash，可以长期缓存；缺失资源必须是真 404，不能回退到 HTML。
# 不要在此 location 上配置 error_page 404 /index.html。
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# 构建版本探针每次发布都会变化，禁止边缘节点长期复用旧值。
location = /version.json {
    try_files $uri =404;
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
}

# 入口 HTML（包括带路由的 SPA 导航）必须重新验证，避免新旧 HTML/资源清单错配。
location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
}

# 根地址通常是用户首次访问入口，显式设置同样的缓存策略。
location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
}

# 该固定脚本由 HTML 入口追加版本查询串；文件本身也不能被边缘节点长期缓存。
location = /seo-static.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
}

# public/ 下的独立 HTML 页面也不能被长期缓存或被 SPA 回退覆盖。
location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
}

# 其他路径才使用 SPA 回退；/assets/ 已由上面的 ^~ location 拦截。
location / {
    try_files $uri $uri/ /index.html;
}
