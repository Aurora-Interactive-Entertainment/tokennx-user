<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b1d" />
    <title>Token NX</title>
    <link rel="icon" type="image/png" href="./src/assets/figma-header/X-16.png" />
    <script>
      (() => {
        // 中文：在样式和 React 加载前应用已保存的主题，避免首屏出现主题闪烁。
        const themeStorageKey = 'token-nx:theme'
        const root = document.documentElement
        let mode = 'dark'

        try {
          const stored = window.localStorage.getItem(themeStorageKey)
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored
        } catch {
          // 中文：浏览器禁用存储时继续使用系统主题，不能阻塞应用启动。
        }

        let prefersLight = false
        try {
          prefersLight = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: light)').matches
        } catch {
          // 中文：系统主题查询失败时按暗色启动，后续主题模块仍可继续接管。
        }
        const theme = mode === 'system' ? (prefersLight ? 'light' : 'dark') : mode
        root.dataset.themeMode = mode
        root.dataset.theme = theme
        root.style.colorScheme = theme
      })()
    </script>
    <script>
      (() => {
        if (window.location.pathname !== '/' && window.location.pathname !== '/home') return

        const configuredApiBase = '%VITE_API_BASE_URL%'
        const apiBase = configuredApiBase.startsWith('%') ? '' : configuredApiBase.trim().replace(/\/+$/, '')
        const homepageUrl = `${apiBase}/api/homepage`
        const requestController = new AbortController()
        const requestTimeout = window.setTimeout(() => requestController.abort(), 15000)

        window.__TOKEN_NX_HOMEPAGE_REQUEST__ = fetch(homepageUrl, {
          credentials: 'omit',
          headers: { Accept: 'application/json' },
          priority: 'high',
          signal: requestController.signal,
        }).then(async (response) => {
          if (!response.ok) return undefined
          const payload = await response.json()
          if (!payload || payload.code !== 0 || !payload.data) return undefined

          const firstCard = Array.isArray(payload.data.cards) ? payload.data.cards[0] : undefined
          const translations = firstCard?.data?.translations
          let language = 'zh-CN'
          try {
            const storedLanguage = window.localStorage.getItem('token-nx:locale')
            if (storedLanguage === 'en-US') language = storedLanguage
          } catch {
            // Storage may be unavailable in privacy-restricted WebViews.
          }
          const content = translations?.[language] ?? translations?.['zh-CN'] ?? translations?.['en-US']
          const objectId = typeof content?.image_object_id === 'string' ? content.image_object_id.trim() : ''
          const imageUrl = /^[0-9A-HJKMNP-TV-Z]{26}$/.test(objectId)
            ? `${apiBase}/api/homepage/assets/${encodeURIComponent(objectId)}`
            : typeof content?.image_url === 'string' ? content.image_url.trim() : ''

          if (imageUrl) {
            const image = new Image()
            image.fetchPriority = 'high'
            image.decoding = 'async'
            const releaseImage = () => { delete window.__TOKEN_NX_HOMEPAGE_LCP_IMAGE__ }
            image.addEventListener('load', releaseImage, { once: true })
            image.addEventListener('error', releaseImage, { once: true })
            window.__TOKEN_NX_HOMEPAGE_LCP_IMAGE__ = image
            image.src = imageUrl
          }

          return payload.data
        }).catch(() => undefined).finally(() => window.clearTimeout(requestTimeout))
      })()
    </script>
    <style>
      :root {
        color-scheme: dark light;
        --boot-bg: #1a1b1d;
        --boot-text: #f5f9fe;
        --boot-muted: #9599a6;
        --boot-line: rgba(224, 226, 242, .15);
        --boot-accent: #65b994;
        --boot-logo-glow: rgba(101, 185, 148, .42);
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }

      html {
        overflow-y: scroll;
        scrollbar-gutter: stable;
      }

      #root {
        position: relative;
        min-height: 100vh;
      }

      #app-mount {
        min-height: 100vh;
      }

      /* 中文：静态首屏只展示品牌 Logo 呼吸灯，避免 React 接管前仍出现旧的进度条。 */
      .app-loading-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: var(--boot-text);
        background: var(--boot-bg);
        opacity: 1;
        pointer-events: auto;
        transition: opacity .42s cubic-bezier(.22, .8, .26, 1), visibility 0s linear .42s;
        visibility: visible;
      }

      html.app-ready .app-loading-shell {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      html.app-ready .app-loading-shell__content {
        opacity: 0;
        transform: translateY(-8px) scale(.98);
      }

      .app-loading-shell__content {
        display: grid;
        justify-items: center;
        padding: 24px;
        text-align: center;
        transition: opacity .3s ease, transform .42s cubic-bezier(.22, .8, .26, 1);
      }

      .app-loading-shell__logo-shell {
        display: grid;
        place-items: center;
        animation: boot-loader-logo-breathe 1.8s ease-in-out infinite;
        transform-origin: center;
      }

      /* 中文：logo 源图比例约 5.45:1，高度自适应完整显示，与 React 接管后的加载页样式保持一致 */
      .app-loading-shell__logo-shell .app-loading-shell__logo {
        display: block;
        width: 220px;
        max-width: calc(100vw - 96px);
        height: auto;
      }

      @keyframes boot-loader-logo-breathe {
        0%, 100% { opacity: .7; filter: drop-shadow(0 0 4px var(--boot-logo-glow)); transform: scale(.98); }
        50% { opacity: 1; filter: drop-shadow(0 0 18px var(--boot-logo-glow)); transform: scale(1); }
      }

      html[data-theme="light"] {
        --boot-bg: #f5f6f8;
        --boot-text: #17181b;
        --boot-muted: #686d78;
        --boot-line: rgba(23, 24, 27, .13);
        --boot-accent: #2f8d68;
        --boot-logo-glow: rgba(72, 105, 181, .36);
      }

      html[data-theme="light"] .app-loading-shell__logo { filter: invert(1); }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          --boot-bg: #f5f6f8;
          --boot-text: #17181b;
          --boot-muted: #686d78;
          --boot-line: rgba(23, 24, 27, .13);
          --boot-accent: #2f8d68;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading-shell,
        .app-loading-shell__content {
          transition-duration: 1ms;
        }

        .app-loading-shell__logo-shell {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-mount"></div>
      <div id="boot-loader" class="app-loading-shell" role="status" aria-label="正在加载 Token NX">
        <div class="app-loading-shell__content">
          <span class="app-loading-shell__logo-shell" aria-hidden="true"><img class="app-loading-shell__logo" src="./src/token-nx-logo.png" alt="" /></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
